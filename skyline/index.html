<body>
  <!-- Static loader: paints before any script runs; the app updates and hides it. -->
  <div class="loader" id="boot" role="status" aria-live="polite">
    <p class="loader-mark">Skyline <em>Residences</em></p>
    <div class="loader-bar"><span id="boot-bar"></span></div>
    <p class="loader-pct" id="boot-pct">Loading the tower</p>
  </div>
  <style>body{background:#121317;margin:0}.loader{z-index:50;color:#f6f3ee;text-align:center;background:radial-gradient(120% 90% at 50% 70%,#3a3026 0%,#1b1b1f 55%,#121317 100%);place-content:center;justify-items:center;gap:18px;padding:0 16px;font-family:Manrope,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;transition:opacity .8s cubic-bezier(.22,1,.36,1),visibility .8s;display:grid;position:fixed;top:0;bottom:0;left:0;right:0}.loader.is-done{opacity:0;visibility:hidden}.loader-mark{letter-spacing:-.01em;margin:0;font:400 clamp(48px,7.4vw,108px)/1 Instrument Serif,Georgia,serif}.loader-mark em{color:#ffe2b6}.loader-bar{background:#ffffff1f;border-radius:2px;width:260px;height:2px;overflow:hidden}.loader-bar span{transform-origin:0;background:#e2b26b;height:100%;transition:transform .35s cubic-bezier(.22,1,.36,1);display:block;transform:scaleX(.04)}.loader-pct{color:#a8a299;letter-spacing:.04em;font-variant-numeric:tabular-nums;margin:0;font-size:12px}</style>
  <div id="root"></div>
